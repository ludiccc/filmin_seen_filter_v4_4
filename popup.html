<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filmin Seen Filter</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #111827; color: #fff; width: 340px; }
    .wrap { padding: 16px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
    button, select, input { font: inherit; }
    input[type="range"] { flex: 1; min-width: 0; }
    button { border: 0; border-radius: 999px; padding: 9px 12px; cursor: pointer; }
    .stack { display: grid; gap: 8px; }
    .muted { color: #cbd5e1; font-size: 13px; }
    .status { min-height: 34px; color: #cbd5e1; font-size: 13px; line-height: 1.3; margin: 10px 0 0; }
    .primary { width: 100%; }
    select { border-radius: 8px; padding: 6px 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <strong>Activo</strong>
      <input id="enabled" type="checkbox">
    </div>
    <div class="row">
      <span>Modo</span>
      <select id="mode">
        <option value="hide">Ocultar</option>
        <option value="dim">Atenuar</option>
      </select>
    </div>
    <div class="row" style="align-items:center; margin-top:4px;">
      <input id="ratingFilterEnabled" type="checkbox" title="Activar filtro por valoración">
      <label for="ratingThreshold" style="white-space:nowrap;">Ocultar &lt; <strong id="ratingValue">7.0</strong></label>
      <input id="ratingThreshold" type="range" min="0" max="10" step="0.1" value="7.0">
    </div>
    <p class="muted">Ocultados por valoración: <span id="ratingHiddenCount">0</span></p>
    <p class="muted">Títulos cargados: <span id="seenCount">0</span></p>
    <p class="muted">Ocultados: <span id="hiddenCount">0</span></p>
    <p class="muted">Atenuados: <span id="dimmedCount">0</span></p>
    <div class="stack">
      <button id="importHistory" class="primary">Cargar historial de la página de Filmin</button>
      <div class="row">
        <button id="rescan">Reescanear</button>
        <button id="options">Abrir opciones</button>
      </div>
    </div>
    <p id="importStatus" class="status"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
